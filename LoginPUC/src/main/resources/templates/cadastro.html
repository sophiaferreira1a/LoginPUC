<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="register-container">
        <div class="register-image-logo-container">
            <img th:src="@{/images/apc-login-bg.png}" alt="Logo da PUC Minas">
        </div>
    <div class="register-form">
        <form th:action="@{/register}" method="post" class="register">
            <h4 class="register-title">Registre-se</h4>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <div class="register-button-container">
                <button type="submit">Enviar</button>
            </div>
            <p class="login-redirect-options">
                Ainda não tem cadastro? <br>
                <a href="/register">Cadastre-se</a>
                <a href="/recoverpassword">Esqueceu sua senha?</a>
            </p>
        </form>
    </div>
    </div>
</body>
</html>
