<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | LoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <!-- Coluna lateral com a imagem/logo -->
        <div class="login-image-logo-container">
            <img th:src="@{/images/bg-puc.jpeg}" alt="Logo da PUC Minas">
        </div>

        <!-- Coluna do formulário de recuperação -->
        <div class="login-form">
            <!-- Mensagem de retorno do processamento (genérica por segurança) -->
            <p class="message message-info" th:if="${message}">
                <span th:text="${message}">Mensagem</span>
            </p>

            <form th:action="@{/recoverpassword}" method="post" class="login-form-box">
                <h4 class="login-title">Recuperar senha</h4>

                <p class="recover-help">
                    Informe o e-mail cadastrado. Enviaremos uma nova senha para você.
                </p>

                <input type="email" id="email" name="email"
                       placeholder="Seu e-mail cadastrado" required autofocus>

                <div class="login-button-container">
                    <button type="submit">Enviar nova senha</button>
                </div>

                <p class="login-redirect-options">
                    Lembrou a senha? <a th:href="@{/login}">Voltar para o login</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
