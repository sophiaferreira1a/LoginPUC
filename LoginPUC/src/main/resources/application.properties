# ---------------------------------------------------------------------
# Aplicação
# ---------------------------------------------------------------------
spring.application.name=LoginPUC

# ---------------------------------------------------------------------
# Banco de dados H2 (em memória)
# Recriado a cada execução. Perfeito para testes/demo.
# Para usar MySQL na entrega, troque as propriedades abaixo por:
#   spring.datasource.url=jdbc:mysql://localhost:3306/loginpuc
#   spring.datasource.username=seu_usuario
#   spring.datasource.password=SUA_SENHA
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:loginpuc;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DDL: o Hibernate cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
# Renomeia o dialeto para não conflitar com a configuracao padrao
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---------------------------------------------------------------------
# Envio de e-mail - padrão do projeto SendEmail da disciplina
# ---------------------------------------------------------------------
# IMPORTANTE: as credenciais NÃO ficam no código. Defina as variáveis
# de ambiente MAIL_USERNAME e MAIL_PASSWORD (App Password do Gmail).
# Veja: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true